name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk EscanerFlotante.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: EscanerFlotante
          path: EscanerFlotante.apk

      - name: Publicar versión para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Escáner Flotante v1.${{ github.run_number }}
          body: Descargá **EscanerFlotante.apk** desde el celular e instalalo.
          files: EscanerFlotante.apk
          make_latest: true
